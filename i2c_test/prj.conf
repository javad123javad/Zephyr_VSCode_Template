CONFIG_I2C=y
CONFIG_PRINTK=y
CONFIG_SENSOR=y
CONFIG_CAN=y
CONFIG_GPIO=y
CONFIG_I2S=y

# M24C64 board-configuration EEPROM on io_cnf_i2c (see eeprom_test.c)
CONFIG_EEPROM=y

# USB1 as a CDC-ACM device (see usb_device_test.c). Zephyr has no
# host-mode driver for this SoC's OTG HS peripheral, so device mode
# is the only way to exercise the USB wiring at all.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="mindos_n6 USB test"

# On-board Ethernet MAC (RMII) + DHCPv4 client (see lan_test.c).
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Interactive follow-up: drop to a shell after the boot-time scan
# and run e.g. `i2c scan i2c@50005400` / `i2c scan i2c@50005800` by hand
# (no devicetree "label" is set on these nodes, so the shell device name
# is the node's full name). "can" shell commands work against mcp2515
# too, e.g. `can show can@0`. "net iface"/"net dhcpv4" for LAN status.
CONFIG_SHELL=y
# The "mind" tests run in the shell thread
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_I2C_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_EEPROM_SHELL=y
