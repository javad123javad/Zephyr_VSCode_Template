# General
CONFIG_MAIN_STACK_SIZE=8192
# CONFIG_HEAP_MEM_POOL_SIZE=49152

# Display / LVGL
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=64000
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_LV_THEME_DEFAULT_DARK=y

# XPT2046 touch input -> LVGL
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y

# PWM-dimmable backlight (auto-dim after inactivity)
CONFIG_LED=y

# External PSRAM (ESP32-S3-WROOM-1 N16R8: 8 MB octal PSRAM). Internal
# DRAM alone ran at ~84% used (Wi-Fi driver state + LVGL's own buffers,
# not app code) before this; ignored on native_sim, which has no PSRAM.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Move LVGL's widget-allocation pool into PSRAM: touched only at
# screen-construction time, not per frame, so PSRAM's extra latency
# doesn't matter here. The draw buffer (LV_Z_VDB_SIZE) stays in
# internal SRAM: it's read/written every frame, and moving it would
# visibly slow rendering on this SPI display link.
#
# This SoC's linker has no generic zephyr,memory-region output section
# for PSRAM (LV_Z_MEMORY_POOL_ZEPHYR_REGION assumes one and fails to
# link); Espressif's own mechanism relocates a named object file's BSS
# instead. lvgl_mem.c's only static data is the pool array itself.
CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="lvgl_mem.c.obj"

# Move the Wi-Fi/net stack's own dynamic buffer allocations into
# PSRAM. Most of the Wi-Fi driver's ~74% share of internal DRAM is
# static blob state this can't touch, but the runtime buffers it can
# move are worth freeing too.
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# Networking / Wi-Fi
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

# No static fallback network: CONNECT_STORED always tries the static
# config first and aborts entirely (never trying any saved network) if
# it fails, so a bad/placeholder static password blocks every real
# connection attempt. All networks are managed on-device instead.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=8

# Persist networks added from the on-device Wi-Fi setup menu.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y

# SNTP
CONFIG_SNTP=y

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y
