<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Robot</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1c1c1a; --key: #fff; --on: #2f6fdb; --line: #c9c9c4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171716; --fg: #ececea; --key: #262624; --line: #3a3a37; } }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 24px; background: var(--bg); color: var(--fg);
         font: 16px system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  .pad { display: grid; grid-template-columns: repeat(3, 84px); grid-template-rows: repeat(2, 84px); gap: 8px; }
  button { font-size: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--key);
           color: var(--fg); touch-action: none; }
  button.on { background: var(--on); border-color: var(--on); color: #fff; }
  #up { grid-column: 2; } #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; } #right { grid-column: 3; grid-row: 2; }
  .speed { display: flex; align-items: center; gap: 12px; width: 268px; }
  .speed input { flex: 1; accent-color: var(--on); }
  .speed output { width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  #status, .hint { min-height: 1.2em; opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<div class="pad">
  <button id="up" aria-label="Forward">&uarr;</button>
  <button id="left" aria-label="Left">&larr;</button>
  <button id="down" aria-label="Backward">&darr;</button>
  <button id="right" aria-label="Right">&rarr;</button>
</div>
<label class="speed">Speed
  <input id="speed" type="range" min="30" max="100" step="5" value="100">
  <output id="speedval">100 %</output>
</label>
<div class="hint">Combine arrows to curve &middot; hold Shift for half speed</div>
<div id="status">stopped</div>
<div id="link" class="hint">connecting&hellip;</div>
<script>
"use strict";
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
const MIN_SPEED = 30;
const REPEAT_MS = 150;
const held = new Set();
const slider = document.getElementById("speed");
const speedval = document.getElementById("speedval");
const status = document.getElementById("status");
let slow = false;
let current = "0 0 0";
let busy = false;

try {
  const saved = localStorage.getItem("speed");
  if (saved !== null) { slider.value = saved; }
} catch (e) { /* storage unavailable */ }

function speed() {
  const s = Number(slider.value);
  return slow ? Math.max(MIN_SPEED, Math.round(s / 2)) : s;
}

function command() {
  const throttle = (held.has("up") ? 1 : 0) - (held.has("down") ? 1 : 0);
  const turn = (held.has("right") ? 1 : 0) - (held.has("left") ? 1 : 0);
  if (throttle === 0 && turn === 0) {
    return "0 0 0";
  }
  return throttle + " " + turn + " " + speed();
}

/* Commands go over the WebSocket; POST /drive is the fallback while it is
 * not open. */
const link = document.getElementById("link");
let ws = null;
let retryMs = 500;

function connect() {
  ws = new WebSocket("ws://" + location.host + "/ws");
  ws.onopen = () => {
    retryMs = 500;
    link.textContent = "connected";
    if (current !== "0 0 0") { ws.send(current); }
  };
  ws.onmessage = e => {
    try {
      const st = JSON.parse(e.data);
      link.textContent = "connected" + (st.rssi ? " \u00b7 " + st.rssi + " dBm" : "");
    } catch (err) { /* ignore malformed status */ }
  };
  ws.onclose = () => {
    ws = null;
    link.textContent = "reconnecting\u2026";
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 5000);
  };
}

function send(cmd) {
  if (ws !== null && ws.readyState === WebSocket.OPEN) {
    ws.send(cmd);
    status.textContent = describe(cmd);
    return;
  }
  if (busy && cmd !== "0 0 0") {
    return;
  }
  busy = true;
  fetch("/drive", { method: "POST", body: cmd })
    .then(r => { status.textContent = r.ok ? describe(cmd) : "error " + r.status; })
    .catch(() => { status.textContent = "no connection"; })
    .finally(() => { busy = false; });
}

function describe(cmd) {
  const [t, r, s] = cmd.split(" ").map(Number);
  if (t === 0 && r === 0) { return "stopped"; }
  const dir = [t > 0 ? "forward" : t < 0 ? "backward" : "spin",
               r > 0 ? "right" : r < 0 ? "left" : ""].join(" ").trim();
  return dir + " · " + s + " %";
}

function update() {
  speedval.textContent = speed() + " %";
  for (const id of Object.values(KEYS)) {
    document.getElementById(id).classList.toggle("on", held.has(id));
  }
  const cmd = command();
  if (cmd !== current) {
    current = cmd;
    busy = false;
    send(cmd);
  }
}

function press(id) { held.add(id); update(); }
function release(id) { held.delete(id); update(); }
function releaseAll() { held.clear(); slow = false; update(); }

document.addEventListener("keydown", e => {
  if (e.key === "Shift") { slow = true; update(); return; }
  if (KEYS[e.key]) { e.preventDefault(); press(KEYS[e.key]); }
});
document.addEventListener("keyup", e => {
  if (e.key === "Shift") { slow = false; update(); return; }
  if (KEYS[e.key]) { e.preventDefault(); release(KEYS[e.key]); }
});
for (const id of Object.values(KEYS)) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); press(id); });
  b.addEventListener("pointerup", () => release(id));
  b.addEventListener("pointercancel", () => release(id));
}
slider.addEventListener("input", () => {
  try { localStorage.setItem("speed", slider.value); } catch (e) { /* storage unavailable */ }
  update();
});
/* Arrow keys would move a focused slider; keep them for driving. */
slider.addEventListener("keydown", e => { if (KEYS[e.key]) { e.preventDefault(); } });
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", releaseAll);

/* The robot stops by itself shortly after the last command, so keep
 * repeating the current one while keys are held. */
setInterval(() => { if (current !== "0 0 0") { send(current); } }, REPEAT_MS);

update();
connect();
</script>
</body>
</html>
