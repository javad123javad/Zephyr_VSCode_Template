CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Calibration of this GY-85 module (flip test and rest recording).
CONFIG_ROBOT_IMU_ACCEL_OFS_X=14
CONFIG_ROBOT_IMU_ACCEL_OFS_Z=151
CONFIG_ROBOT_IMU_GYRO_BIAS_X=-5251
CONFIG_ROBOT_IMU_GYRO_BIAS_Y=-1675
CONFIG_ROBOT_IMU_GYRO_BIAS_Z=-431

# Wi-Fi station with DHCP. Everything runs over UDP: the PC link, firmware
# updates, mDNS and DHCP, so TCP is not built in.
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_L2_WIFI_MGMT=y
# Modem sleep delays incoming packets by up to a beacon interval.
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# Sockets: PC link, firmware updates, mDNS on both interfaces, DHCP client
# and the own network's DHCP server.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_ZVFS_OPEN_MAX=10

# Station plus own access point as fallback
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Reachable as robot.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="robot"
CONFIG_MDNS_RESPONDER=y

# Firmware update over Wi-Fi: MCUmgr image and OS groups on UDP port 1337,
# images verified and swapped by MCUboot (see sysbuild.conf).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# Lets the PC tool use larger upload chunks.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
